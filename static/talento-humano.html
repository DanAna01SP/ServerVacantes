<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Talento Humano · Cooperativa San Pedro</title>
    <link rel="icon" type="image/png" href="/img/imagotipo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        :root { --azul: #033E81; --azul-osc: #022d5e; --verde: #4EAE33; --rojo: #c0392b; }
        body { background: #f4f6fa; color: #333; min-height: 100vh; }
        [hidden] { display: none !important; }

        /* ---------- LOGIN ---------- */
        .login-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            background: linear-gradient(135deg, var(--azul) 0%, var(--azul-osc) 100%);
        }
        .login-card {
            background: white; border-radius: 24px; padding: 44px 36px 36px; width: 100%; max-width: 420px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35); text-align: center;
        }
        .login-card img { height: 72px; margin-bottom: 20px; }
        .badge-admin {
            display: inline-block; background: rgba(3,62,129,0.08); color: var(--azul); border-radius: 50px;
            padding: 5px 16px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 10px;
        }
        .login-card h1 { font-size: 1.5rem; font-weight: 900; color: var(--azul); }
        .login-card .sub { color: #999; font-size: 0.85rem; margin: 4px 0 26px; }
        .login-card form { text-align: left; }
        .login-card .back { margin-top: 20px; }
        .login-card .back a { color: #aaa; font-size: 0.82rem; text-decoration: none; }
        .login-card .back a:hover { color: var(--azul); }

        /* ---------- CAMPOS ---------- */
        label.campo { display: block; font-size: 0.8rem; font-weight: 700; color: #555; margin-bottom: 6px; }
        input[type=text], input[type=email], input[type=password], input[type=date] {
            width: 100%; border: 2px solid #e9ecef; border-radius: 10px; padding: 10px 14px; font-size: 0.95rem;
            color: #333; outline: none; margin-bottom: 16px; transition: border-color .2s, box-shadow .2s; background: white;
        }
        input:focus { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(3,62,129,0.1); }

        .btn {
            border: none; border-radius: 10px; padding: 10px 18px; font-size: 0.92rem; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, box-shadow .2s, opacity .2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: .6; cursor: wait; transform: none; }
        .btn-verde { background: linear-gradient(135deg, var(--verde), #3c9228); color: white; }
        .btn-verde:hover { box-shadow: 0 8px 22px rgba(78,174,51,0.35); }
        .btn-azul { background: var(--azul); color: white; }
        .btn-gris { background: #eef1f5; color: #555; }
        .btn-rojo { background: #fdecea; color: var(--rojo); }
        .btn-bloque { width: 100%; justify-content: center; padding: 12px; font-size: 1rem; }

        .alerta {
            background: #fff5f5; border: 1px solid #ffc9c9; color: var(--rojo); border-radius: 10px;
            padding: 10px 14px; font-size: 0.85rem; margin-bottom: 16px;
        }

        /* ---------- PANEL ---------- */
        .adm-header {
            background: linear-gradient(135deg, var(--azul), var(--azul-osc)); color: white; padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        }
        .adm-header img { height: 40px; }
        .adm-header .izq { display: flex; align-items: center; gap: 14px; }
        .adm-header .titulo { font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
        .adm-header .titulo span { display: block; font-weight: 300; font-size: 0.78rem; opacity: .8; }
        .adm-header .der { display: flex; gap: 8px; flex-wrap: wrap; }
        .adm-header .btn-gris { background: rgba(255,255,255,0.12); color: white; text-decoration: none; }

        .adm-main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
        .tarjeta { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 24px; }
        .tarjeta h2 { font-size: 1.15rem; color: var(--azul); font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .form-sticky { position: sticky; top: 20px; }

        .zona-imagen {
            border: 2px dashed #cfd6e0; border-radius: 12px; padding: 16px; text-align: center; cursor: pointer;
            margin-bottom: 16px; color: #888; font-size: 0.85rem; transition: border-color .2s, background .2s;
        }
        .zona-imagen:hover, .zona-imagen.arrastrando { border-color: var(--azul); background: rgba(3,62,129,0.03); }
        .zona-imagen i { font-size: 1.8rem; color: var(--azul); display: block; margin-bottom: 6px; }
        .zona-imagen img { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; margin: 0 auto 8px; }

        .interruptor { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer; font-size: 0.92rem; user-select: none; }
        .interruptor input { display: none; }
        .interruptor .pista { width: 44px; height: 24px; background: #ccd3dc; border-radius: 12px; position: relative; transition: background .2s; flex-shrink: 0; }
        .interruptor .pista::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: white; top: 3px; left: 3px; transition: left .2s; }
        .interruptor input:checked + .pista { background: var(--verde); }
        .interruptor input:checked + .pista::after { left: 23px; }
        .acciones-form { display: flex; gap: 8px; }
        .acciones-form .btn-verde { flex: 1; justify-content: center; }

        .lista-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
        .lista-cab h2 { margin: 0; }
        .contador { font-size: 0.85rem; color: #888; }
        .grid-vacantes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .vac { border: 1px solid #edf0f4; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: white; }
        .vac.inactiva { opacity: .6; }
        .vac-img { aspect-ratio: 4 / 5; background: #f0f2f5; overflow: hidden; }
        .vac-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .vac-cuerpo { padding: 12px 14px; flex: 1; }
        .vac-titulo { font-weight: 700; color: var(--azul); font-size: 0.98rem; margin-bottom: 4px; word-break: break-word; }
        .vac-meta { font-size: 0.8rem; color: #777; display: flex; flex-direction: column; gap: 2px; }
        .estado { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 50px; padding: 2px 10px; margin-bottom: 6px; }
        .estado.si { background: rgba(78,174,51,0.12); color: #2f7d1d; }
        .estado.no { background: #eef1f5; color: #777; }
        .estado.vencida { background: #fff4e5; color: #b36b00; margin-left: 4px; }
        .vac-acciones { display: flex; border-top: 1px solid #edf0f4; }
        .vac-acciones button { flex: 1; background: none; border: none; padding: 10px 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #555; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .vac-acciones button + button { border-left: 1px solid #edf0f4; }
        .vac-acciones button:hover { background: #f7f9fb; color: var(--azul); }
        .vac-acciones button.borrar:hover { color: var(--rojo); background: #fdf3f2; }

        .vacio { text-align: center; color: #999; padding: 50px 10px; }
        .vacio i { font-size: 2.4rem; display: block; margin-bottom: 8px; color: #c5ccd6; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: #333; color: white; padding: 12px 22px; border-radius: 10px; font-size: 0.9rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25); transition: transform .3s; z-index: 50; max-width: calc(100% - 32px);
        }
        .toast.ver { transform: translateX(-50%) translateY(0); }
        .toast.ok { background: #2f7d1d; }
        .toast.error { background: var(--rojo); }

        @media (max-width: 900px) {
            .adm-main { grid-template-columns: 1fr; }
            .form-sticky { position: static; }
        }
        @media (max-width: 520px) {
            .adm-header { padding: 12px 16px; }
            .adm-header .titulo span { display: none; }
            .adm-main { padding: 16px 16px 40px; }
            .tarjeta { padding: 18px; }
        }
    </style>
</head>
<body>

    <!-- ================= LOGIN ================= -->
    <div class="login-wrap" id="vistaLogin" hidden>
        <div class="login-card">
            <img src="/img/imagotipo.png" alt="Cooperativa San Pedro">
            <div class="badge-admin"><i class="bi bi-people-fill"></i> Talento Humano</div>
            <h1>Acceso al Sistema</h1>
            <p class="sub">Ingresa para publicar las plazas de empleo</p>

            <div class="alerta" id="errLogin" hidden></div>

            <form id="formLogin" autocomplete="on">
                <label class="campo" for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" autocapitalize="off" spellcheck="false" required>
                <label class="campo" for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" autocomplete="current-password" required>
                <button type="submit" class="btn btn-verde btn-bloque" id="btnLogin">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
            <div class="back"><a href="https://sanpedroesmicoope.com.gt/pages/empleo.html"><i class="bi bi-arrow-left"></i> Volver a Empleo</a></div>
        </div>
    </div>

    <!-- ================= PANEL ================= -->
    <div id="vistaPanel" hidden>
        <header class="adm-header">
            <div class="izq">
                <img src="/img/logo-blanco.png" alt="Logo">
                <div class="titulo">Talento Humano · Vacantes<span id="nombreUsuario">Cooperativa San Pedro R.L.</span></div>
            </div>
            <div class="der">
                <a class="btn btn-gris" href="/admin" id="enlaceUsuarios" hidden><i class="bi bi-people"></i> Usuarios</a>
                <a class="btn btn-gris" href="https://sanpedroesmicoope.com.gt/pages/empleo.html" target="_blank" rel="noopener"><i class="bi bi-eye"></i> Ver página de empleo</a>
                <button class="btn btn-gris" id="btnSalir"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </header>

        <main class="adm-main">
            <!-- Formulario -->
            <section class="tarjeta form-sticky">
                <h2 id="tituloForm"><i class="bi bi-plus-circle"></i> Nueva vacante</h2>
                <form id="formVacante" novalidate>
                    <input type="hidden" name="id" id="vacId">

                    <label class="campo" for="titulo">Puesto *</label>
                    <input type="text" id="titulo" name="titulo" maxlength="200" required placeholder="Ej. Asesor de Créditos">

                    <label class="campo" for="agencia">Agencia</label>
                    <input type="text" id="agencia" name="agencia" maxlength="200" placeholder="Ej. Agencia Central">

                    <label class="campo" for="fechaLimite">Fecha límite</label>
                    <input type="date" id="fechaLimite" name="fechaLimite">

                    <label class="campo">Imagen de la convocatoria * <span style="font-weight:400;color:#999;">(JPG, PNG o WEBP, máx. 8 MB)</span></label>
                    <div class="zona-imagen" id="zonaImagen" tabindex="0" role="button" aria-label="Seleccionar imagen">
                        <img id="vistaPrevia" alt="" hidden>
                        <div id="textoZona"><i class="bi bi-cloud-arrow-up"></i>Haz clic o arrastra la imagen aquí</div>
                    </div>
                    <input type="file" id="imagen" name="imagen" accept="image/jpeg,image/png,image/webp" hidden>

                    <label class="interruptor">
                        <input type="checkbox" id="activa" checked>
                        <span class="pista"></span>
                        <span>Publicada en la página de empleo</span>
                    </label>

                    <div class="alerta" id="errForm" hidden></div>

                    <div class="acciones-form">
                        <button type="submit" class="btn btn-verde" id="btnGuardar"><i class="bi bi-check-circle"></i> <span>Publicar vacante</span></button>
                        <button type="button" class="btn btn-gris" id="btnCancelar" hidden>Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- Lista -->
            <section class="tarjeta">
                <div class="lista-cab">
                    <h2><i class="bi bi-briefcase"></i> Vacantes</h2>
                    <span class="contador" id="contador"></span>
                </div>
                <div id="listaVacantes"><div class="vacio"><i class="bi bi-hourglass-split"></i>Cargando…</div></div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const $ = (id) => document.getElementById(id);
        let vacantes = [];

        const escapar = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function toast(msg, tipo) {
            const t = $('toast');
            t.textContent = msg;
            t.className = 'toast ver ' + (tipo || '');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.className = 'toast', 3200);
        }

        async function api(ruta, opciones = {}) {
            const res = await fetch(ruta, { credentials: 'same-origin', ...opciones });
            let data = {};
            try { data = await res.json(); } catch (_) {}
            if (res.status === 401 && ruta !== '/api/login') {
                mostrarLogin();
                throw new Error(data.error || 'Tu sesión expiró. Ingresa de nuevo.');
            }
            if (!res.ok) throw new Error(data.error || 'Error del servidor (' + res.status + ')');
            return data;
        }

        /* ---------- Vistas ---------- */
        function mostrarLogin() {
            $('vistaPanel').hidden = true;
            $('vistaLogin').hidden = false;
            $('usuario').focus();
        }
        function mostrarPanel(usuario) {
            $('nombreUsuario').textContent = usuario.nombre + ' · ' + (usuario.rol === 'admin' ? 'Administrador' : 'Talento Humano');
            $('enlaceUsuarios').hidden = usuario.rol !== 'admin';
            $('vistaLogin').hidden = true;
            $('vistaPanel').hidden = false;
            cargarVacantes();
        }

        /* ---------- Login / logout ---------- */
        $('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btnLogin');
            btn.disabled = true;
            $('errLogin').hidden = true;
            try {
                const data = await api('/api/login', { method: 'POST', body: new FormData(e.target) });
                $('clave').value = '';
                mostrarPanel(data.usuario);
            } catch (err) {
                $('errLogin').textContent = err.message;
                $('errLogin').hidden = false;
                $('clave').value = '';
            } finally {
                btn.disabled = false;
            }
        });

        $('btnSalir').addEventListener('click', async () => {
            try { await api('/api/logout', { method: 'POST' }); } catch (_) {}
            limpiarForm();
            mostrarLogin();
        });

        /* ---------- Lista ---------- */
        async function cargarVacantes() {
            try {
                const data = await api('/api/listar?todas=1');
                vacantes = data.vacantes || [];
                pintarLista();
            } catch (err) {
                $('listaVacantes').innerHTML = `<div class="vacio"><i class="bi bi-exclamation-triangle"></i>${escapar(err.message)}</div>`;
            }
        }

        function formatearFecha(iso) {
            if (!iso) return '';
            const [a, m, d] = iso.split('-');
            return `${d}/${m}/${a}`;
        }

        function pintarLista() {
            const activas = vacantes.filter(v => v.activa).length;
            $('contador').textContent = `${activas} publicada${activas === 1 ? '' : 's'} · ${vacantes.length} en total`;

            if (!vacantes.length) {
                $('listaVacantes').innerHTML = '<div class="vacio"><i class="bi bi-inbox"></i>Aún no hay vacantes. Crea la primera con el formulario.</div>';
                return;
            }

            const hoy = new Date().toISOString().slice(0, 10);
            $('listaVacantes').innerHTML = '<div class="grid-vacantes">' + vacantes.map(v => {
                const vencida = v.fechaLimite && v.fechaLimite < hoy;
                return `
                <article class="vac ${v.activa ? '' : 'inactiva'}">
                    <div class="vac-img">${v.imagenUrl ? `<img src="${escapar(v.imagenUrl)}" alt="${escapar(v.titulo)}" loading="lazy">` : ''}</div>
                    <div class="vac-cuerpo">
                        <span class="estado ${v.activa ? 'si' : 'no'}">${v.activa ? 'Publicada' : 'Oculta'}</span>${vencida ? '<span class="estado vencida">Vencida</span>' : ''}
                        <div class="vac-titulo">${escapar(v.titulo)}</div>
                        <div class="vac-meta">
                            ${v.agencia ? `<span><i class="bi bi-geo-alt"></i> ${escapar(v.agencia)}</span>` : ''}
                            ${v.fechaLimite ? `<span><i class="bi bi-calendar-event"></i> Hasta ${formatearFecha(v.fechaLimite)}</span>` : ''}
                        </div>
                    </div>
                    <div class="vac-acciones">
                        <button data-accion="editar" data-id="${escapar(v.id)}"><i class="bi bi-pencil"></i> Editar</button>
                        <button data-accion="alternar" data-id="${escapar(v.id)}"><i class="bi ${v.activa ? 'bi-eye-slash' : 'bi-eye'}"></i> ${v.activa ? 'Ocultar' : 'Publicar'}</button>
                        <button data-accion="eliminar" data-id="${escapar(v.id)}" class="borrar"><i class="bi bi-trash"></i> Borrar</button>
                    </div>
                </article>`;
            }).join('') + '</div>';
        }

        $('listaVacantes').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-accion]');
            if (!btn) return;
            const v = vacantes.find(x => x.id === btn.dataset.id);
            if (!v) return;

            if (btn.dataset.accion === 'editar') return editar(v);

            if (btn.dataset.accion === 'alternar') {
                const fd = new FormData();
                fd.append('id', v.id);
                fd.append('titulo', v.titulo);
                fd.append('agencia', v.agencia || '');
                fd.append('fechaLimite', v.fechaLimite || '');
                fd.append('activa', v.activa ? '0' : '1');
                btn.disabled = true;
                try {
                    await api('/api/guardar', { method: 'POST', body: fd });
                    toast(v.activa ? 'Vacante ocultada' : 'Vacante publicada', 'ok');
                    await cargarVacantes();
                } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
            }

            if (btn.dataset.accion === 'eliminar') {
                if (!confirm(`¿Eliminar la vacante "${v.titulo}"? Esta acción no se puede deshacer.`)) return;
                const fd = new FormData();
                fd.append('id', v.id);
                btn.disabled = true;
                try {
                    await api('/api/eliminar', { method: 'POST', body: fd });
                    if ($('vacId').value === v.id) limpiarForm();
                    toast('Vacante eliminada', 'ok');
                    await cargarVacantes();
                } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
            }
        });

        /* ---------- Formulario ---------- */
        let imagenActualUrl = '';

        function editar(v) {
            $('vacId').value = v.id;
            $('titulo').value = v.titulo || '';
            $('agencia').value = v.agencia || '';
            $('fechaLimite').value = v.fechaLimite || '';
            $('activa').checked = !!v.activa;
            $('imagen').value = '';
            imagenActualUrl = v.imagenUrl || '';
            mostrarPrevia(imagenActualUrl, 'Clic para reemplazar la imagen');
            $('tituloForm').innerHTML = '<i class="bi bi-pencil-square"></i> Editar vacante';
            $('btnGuardar').querySelector('span').textContent = 'Guardar cambios';
            $('btnCancelar').hidden = false;
            $('errForm').hidden = true;
            $('formVacante').scrollIntoView({ behavior: 'smooth', block: 'start' });
            $('titulo').focus();
        }

        function limpiarForm() {
            $('formVacante').reset();
            $('vacId').value = '';
            $('activa').checked = true;
            imagenActualUrl = '';
            mostrarPrevia('', '');
            $('tituloForm').innerHTML = '<i class="bi bi-plus-circle"></i> Nueva vacante';
            $('btnGuardar').querySelector('span').textContent = 'Publicar vacante';
            $('btnCancelar').hidden = true;
            $('errForm').hidden = true;
        }
        $('btnCancelar').addEventListener('click', limpiarForm);

        function mostrarPrevia(src, texto) {
            const img = $('vistaPrevia');
            if (src) { img.src = src; img.hidden = false; }
            else { img.removeAttribute('src'); img.hidden = true; }
            $('textoZona').innerHTML = src
                ? `<small>${escapar(texto)}</small>`
                : '<i class="bi bi-cloud-arrow-up"></i>Haz clic o arrastra la imagen aquí';
        }

        function elegirArchivo(archivo) {
            if (!archivo) return;
            if (!/^image\/(jpeg|png|webp)$/.test(archivo.type)) { toast('Formato no permitido. Usa JPG, PNG o WEBP.', 'error'); return false; }
            if (archivo.size > 8 * 1024 * 1024) { toast('La imagen supera 8 MB.', 'error'); return false; }
            mostrarPrevia(URL.createObjectURL(archivo), archivo.name);
            return true;
        }

        const zona = $('zonaImagen');
        zona.addEventListener('click', () => $('imagen').click());
        zona.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('imagen').click(); } });
        $('imagen').addEventListener('change', (e) => {
            if (elegirArchivo(e.target.files[0]) === false) {
                e.target.value = '';
                mostrarPrevia(imagenActualUrl, 'Clic para reemplazar la imagen');
            }
        });
        zona.addEventListener('dragover', (e) => { e.preventDefault(); zona.classList.add('arrastrando'); });
        zona.addEventListener('dragleave', () => zona.classList.remove('arrastrando'));
        zona.addEventListener('drop', (e) => {
            e.preventDefault();
            zona.classList.remove('arrastrando');
            const archivo = e.dataTransfer.files[0];
            if (elegirArchivo(archivo)) {
                const dt = new DataTransfer();
                dt.items.add(archivo);
                $('imagen').files = dt.files;
            }
        });

        $('formVacante').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = $('errForm');
            err.hidden = true;

            if (!$('titulo').value.trim()) { err.textContent = 'El puesto es obligatorio.'; err.hidden = false; $('titulo').focus(); return; }
            if (!$('imagen').files.length && !imagenActualUrl) { err.textContent = 'Selecciona la imagen de la convocatoria.'; err.hidden = false; return; }

            const fd = new FormData(e.target);
            fd.set('activa', $('activa').checked ? '1' : '0');
            if (!$('imagen').files.length) fd.delete('imagen');

            const btn = $('btnGuardar');
            const editando = !!$('vacId').value;
            btn.disabled = true;
            try {
                await api('/api/guardar', { method: 'POST', body: fd });
                toast(editando ? 'Cambios guardados' : 'Vacante publicada', 'ok');
                limpiarForm();
                await cargarVacantes();
            } catch (ex) {
                err.textContent = ex.message;
                err.hidden = false;
            } finally {
                btn.disabled = false;
            }
        });

        /* ---------- Inicio ---------- */
        (async function iniciar() {
            try {
                const data = await api('/api/sesion');
                data.logueado ? mostrarPanel(data.usuario) : mostrarLogin();
            } catch (_) {
                mostrarLogin();
            }
        })();
    </script>
</body>
</html>
